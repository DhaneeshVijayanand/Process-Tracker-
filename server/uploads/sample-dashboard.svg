<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#120e29"/>
      <stop offset="100%" stop-color="#080718"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <!-- Dashboard Wireframe UI -->
  <rect x="50" y="40" width="700" height="370" rx="20" fill="rgba(18, 14, 41, 0.6)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="85" cy="70" r="7" fill="#ef4444"/>
  <circle cx="108" cy="70" r="7" fill="#eab308"/>
  <circle cx="131" cy="70" r="7" fill="#22c55e"/>
  <text x="400" y="75" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">EXECUTIVE ANALYTICS HUD - LIVE DATA SIMULATION</text>
  
  <!-- Metric boxes -->
  <rect x="80" y="100" width="190" height="80" rx="12" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.3)"/>
  <text x="100" y="125" fill="#67e8f9" font-family="sans-serif" font-size="11">KPI COMPLETION</text>
  <text x="100" y="160" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">65.4%</text>

  <rect x="290" y="100" width="190" height="80" rx="12" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)"/>
  <text x="310" y="125" fill="#d8b4fe" font-family="sans-serif" font-size="11">VELOCITY INDEX</text>
  <text x="310" y="160" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">94.8 pts</text>

  <rect x="500" y="100" width="220" height="80" rx="12" fill="rgba(236, 72, 153, 0.08)" stroke="rgba(236, 72, 153, 0.3)"/>
  <text x="520" y="125" fill="#f472b6" font-family="sans-serif" font-size="11">STAGE HEALTH</text>
  <text x="520" y="160" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">OPTIMAL ⚡</text>

  <!-- Area Chart Wave -->
  <path d="M 80 320 Q 180 220 280 260 T 480 210 T 680 240 L 680 350 L 80 350 Z" fill="url(#chart-grad)"/>
  <path d="M 80 320 Q 180 220 280 260 T 480 210 T 680 240" fill="none" stroke="#00f5ff" stroke-width="3"/>
</svg>
